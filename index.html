<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAL</title>
  </head>
  <body>
    <main id="hal" aria-label="Monitor de recursos, clima y hora">
      <div class="visualizer" aria-hidden="true">
        <div class="equalizer">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <svg class="signal" viewBox="0 0 116 70" preserveAspectRatio="none">
          <path id="wave-tail" />
          <path id="wave-path" />
        </svg>
        <svg id="weather-icon" class="weather-icon" viewBox="0 0 64 64" aria-hidden="true"></svg>
        <svg id="hal-clock" class="hal-clock" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="25" />
          <path class="clock-marks" d="M32 10v5M32 49v5M10 32h5M49 32h5" />
          <path id="clock-hour" class="clock-hand hour-hand" d="M32 32V20" />
          <path id="clock-minute" class="clock-hand minute-hand" d="M32 32V13" />
          <circle class="clock-core" cx="32" cy="32" r="3" />
        </svg>
        <svg class="btc-icon" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="25" />
          <text x="32" y="42" text-anchor="middle">B</text>
          <path d="M25 16v32M30 14v36" />
        </svg>
        <svg class="hal-face" viewBox="0 0 120 80" aria-hidden="true">
          <path class="face-hood" d="M60 4C32 4 14 24 14 45c0 10 4 19 11 26h70c7-7 11-16 11-26C106 24 88 4 60 4Z" />
          <path class="face-headband" d="M23 42C23 20 39 8 60 8s37 12 37 34" />
          <rect class="face-shell" x="22" y="16" width="76" height="48" rx="24" />
          <rect class="face-visor" x="34" y="26" width="52" height="28" rx="14" />
          <circle class="face-eye" cx="48" cy="40" r="7" />
          <circle class="face-eye" cx="72" cy="40" r="7" />
          <circle class="face-shine" cx="50" cy="37.5" r="2" />
          <circle class="face-shine" cx="74" cy="37.5" r="2" />
          <path class="face-happy-eye" d="M42 41c2.5-4 7-4 9.5 0M68.5 41c2.5-4 7-4 9.5 0" />
          <path class="face-mouth" d="M54 51c3 3 9 3 12 0" />
          <path class="face-smile" d="M49 50c4 6 18 6 22 0" />
          <circle class="face-blush" cx="33" cy="49" r="4" />
          <circle class="face-blush" cx="87" cy="49" r="4" />
          <path class="face-antenna" d="M60 16V7" />
          <circle class="face-antenna-tip" cx="60" cy="6" r="3" />
          <g class="face-glasses">
            <circle cx="48" cy="40" r="11" />
            <circle cx="72" cy="40" r="11" />
            <path d="M59 40h2M37 38l-4-3M83 38l4-3" />
          </g>
          <g class="face-headphones">
            <rect x="16" y="31" width="13" height="18" rx="6" />
            <rect x="91" y="31" width="13" height="18" rx="6" />
            <path class="headphone-detail" d="M22.5 38v4M97.5 38v4" />
          </g>
          <g class="face-music">
            <path d="M103 20v13m0-13 7-2v12m-7 3a3 3 0 1 1 0-6m7 3a3 3 0 1 1 0-6" />
          </g>
        </svg>
        <svg class="task-face" viewBox="0 0 120 80" aria-hidden="true">
          <rect class="task-shell" x="22" y="16" width="76" height="48" rx="24" />
          <circle class="task-lens" cx="60" cy="40" r="15" />
          <circle class="task-lens-core" cx="60" cy="40" r="6" />
          <path class="task-badge" d="M90 8h20v20H90zM96 18l4 4 7-9" />
        </svg>
        <div class="w-gauge">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="w-gauge-track" cx="50" cy="50" r="42" />
            <circle id="gauge-arc" class="w-gauge-arc" cx="50" cy="50" r="42" />
          </svg>
          <b class="w-gauge-num"><span id="gauge-value">0</span>%</b>
        </div>
      </div>
      <div class="w-photo">
        <img id="photo-img" alt="Foto de HAL" />
      </div>
      <output id="metric">CPU 0.0%</output>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
