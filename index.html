<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAL</title>
  </head>
  <body>
    <main id="hal" aria-label="Monitor de recursos, clima y hora">
      <div class="visualizer" aria-hidden="true">
        <div class="equalizer">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <svg class="signal" viewBox="0 0 116 70" preserveAspectRatio="none">
          <path id="wave-tail" />
          <path id="wave-path" />
        </svg>
        <svg id="weather-icon" class="weather-icon" viewBox="0 0 64 64" aria-hidden="true"></svg>
        <svg id="hal-clock" class="hal-clock" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="25" />
          <path class="clock-marks" d="M32 10v5M32 49v5M10 32h5M49 32h5" />
          <path id="clock-hour" class="clock-hand hour-hand" d="M32 32V20" />
          <path id="clock-minute" class="clock-hand minute-hand" d="M32 32V13" />
          <circle class="clock-core" cx="32" cy="32" r="3" />
        </svg>
        <svg class="btc-icon" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="25" />
          <text x="32" y="42" text-anchor="middle">B</text>
          <path d="M25 16v32M30 14v36" />
        </svg>
        <svg class="hal-face" viewBox="0 0 120 80" aria-hidden="true">
          <path class="face-hood" d="M25 64C12 52 13 21 34 10c14-8 38-8 52 0 21 11 22 42 9 54H25Z" />
          <path class="face-headband" d="M27 46V35a33 33 0 0 1 66 0v11" />
          <path class="face-shell" d="M29 20C43 13 77 13 91 20c9 5 13 15 11 27-2 13-11 20-24 23-12 3-24 3-36 0-13-3-22-10-24-23-2-12 2-22 11-27Z" />
          <circle class="face-eye" cx="47" cy="42" r="6" />
          <circle class="face-eye" cx="73" cy="42" r="6" />
          <g class="face-glasses">
            <circle cx="47" cy="42" r="10" />
            <circle cx="73" cy="42" r="10" />
            <path d="M57 42h6" />
          </g>
          <g class="face-headphones">
            <path d="M24 43h9v15h-9M87 43h9v15h-9" />
          </g>
          <path class="face-status" d="M53 57h14" />
        </svg>
        <svg class="task-face" viewBox="0 0 120 80" aria-hidden="true">
          <path class="task-shell" d="M29 20C43 13 77 13 91 20c9 5 13 15 11 27-2 13-11 20-24 23-12 3-24 3-36 0-13-3-22-10-24-23-2-12 2-22 11-27Z" />
          <circle class="task-eye" cx="47" cy="42" r="6" />
          <circle class="task-eye" cx="73" cy="42" r="6" />
          <path class="task-badge" d="M87 15h18v18H87zM92 24l4 4 6-8" />
        </svg>
      </div>
      <output id="metric">CPU 0.0%</output>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
